<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Sri Naga Charani — AI Engineering and Backend Systems">
<style>
  .lbl { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2.4px; fill: #9a6700; }
  .name { font: 400 58px Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #1f2328; letter-spacing: -0.5px; }
  .lede { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
  .meta { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #59636e; letter-spacing: 0.6px; }
  .cap { font: italic 12px Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #59636e; }
  .edge { stroke: #9a6700; stroke-width: 1.2; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.1s ease-out forwards; }
  .nn { fill: #9a6700; opacity: 0; animation: fade .5s ease-out forwards; }
  .q { fill: #9a6700; }
  .halo { fill: none; stroke: #9a6700; stroke-width: 1; opacity: .5; transform-origin: 808px 138px; animation: pulse 3.2s ease-out infinite; }
  .ball { fill: none; stroke: #59636e; stroke-width: .8; stroke-dasharray: 3 4; opacity: 0; animation: fade .6s ease-out 1.2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 70% { transform: scale(3.2); opacity: 0; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .edge, .nn, .ball { animation: none; stroke-dashoffset: 0; opacity: 1; } .halo { animation: none; } }
</style>
