<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Sri Naga Charani — AI Engineering and Backend Systems">
<defs><linearGradient id="g" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#fdba74"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="nameclip"><text x="38" y="140" style="font: 400 58px Georgia, 'Iowan Old Style', 'Times New Roman', serif; letter-spacing:-0.5px">Sri Naga Charani</text></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".22"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient></defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; } .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .muted { fill: #8b949e; } .fg { fill: #e6edf3; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .edge { stroke: url(#g); stroke-width: 1.4; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.1s ease-out forwards; }
  .nn { fill: #c4b5fd; opacity: 0; animation: fade .5s ease-out forwards; }
  .halo { fill: none; stroke: #fdba74; stroke-width: 1.2; transform-origin: 808px 138px; animation: pulse 3.2s ease-out infinite; }
  .ball { fill: none; stroke: #5eead4; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0; transform-origin: 808px 138px; animation: fade .6s ease-out 1.2s forwards, spin 40s linear infinite; }
  .tw { animation: tw 4s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 70% { transform: scale(3.4); opacity: 0; } 100% { opacity: 0; } }
  @keyframes tw { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
</style>
